[package]
name = "canvaz"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu = "30"
winit = "0.30"
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = "0.37"
egui-winit = "0.37"
glam = { version = "0.34", features = ["bytemuck"] }
rayon = "1.12"
bytemuck = { version = "1.25", features = ["derive"] }
half = { version = "2.7", features = ["bytemuck"] }
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
rfd = "0.15"
ron = "0.10"
serde = { version = "1", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
rand = "0.9"
lz4_flex = "0.11"

[build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
debug = 1
